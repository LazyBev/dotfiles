# ─────────────────────────────────────────────
# Foot terminal config (new syntax)
# ─────────────────────────────────────────────

[main]
include=~/.config/foot/themes/dracula

[font]
font=JetBrainsMono Nerd Font:size=11

term=xterm-256color
dpi-aware=yes

initial-window-size-pixels=1000x600
pad=10x10

# ─────────────────────────────────────────────
# Cursor (MOVED OUT OF [main] in newer foot)
# ─────────────────────────────────────────────

[cursor]
style=beam
blink=yes

# ─────────────────────────────────────────────
# Scrollback
# ─────────────────────────────────────────────

[scrollback]
lines=10000

# ─────────────────────────────────────────────
# Mouse
# ─────────────────────────────────────────────

[mouse]
hide-when-typing=yes
